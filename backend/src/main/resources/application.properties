spring.application.name=quizlive-backend
server.port=${PORT:8080}

# MySQL DataSource with environment variable configuration support
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/quizlive?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

# HikariCP Connection Pool (Optimized for 80-100 simultaneous participants)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:30}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:10}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=QuizoraHikariPool

# Faculty Authentication Secret for Stateful & Stateless Persistence
quizora.auth.secret=${QUIZORA_AUTH_SECRET:quizora-production-secure-hmac-secret-key-stable-256}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
spring.jpa.properties.hibernate.format_sql=false

# Error message exposure in HTTP responses
server.error.include-message=always
server.error.include-binding-errors=always

# WebSocket buffer settings
spring.websocket.message-size-limit=128KB

# CORS & WebSocket Allowed Origins (Production Vercel and Local Development)
quizora.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://live-quiz-system.vercel.app,https://*.vercel.app,http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}
